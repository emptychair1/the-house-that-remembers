<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Thunderclap Lab · The House That Remembers</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#171513;font-family:Baskerville,"Iowan Old Style",Georgia,serif}body{height:100dvh;overflow:hidden}.page{position:fixed;inset:0;background:#f6f0e6;display:flex;align-items:flex-start;justify-content:center;padding:10vh 8vw 7vh}.inner{width:100%;max-width:42rem;text-align:center}.kicker{font:700 .62rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;opacity:.48;margin-bottom:2rem}.copy{font-size:clamp(1.1rem,4.4vw,1.45rem);line-height:1.5;margin:0 auto;color:rgba(23,21,19,.72);max-width:34rem}.copy p{margin:0 0 1.25rem}.tc{position:relative;display:inline}.gone{visibility:hidden}.ghost{position:absolute;inset:-.1em;pointer-events:none;opacity:0}.snap .ghost{animation:ghostSnap .18s steps(1,end) both}.pressure{animation:pressure .13s ease both}.fracture{animation:fracture .16s steps(2,end) both}.blackcut{animation:blackcut .12s steps(1,end) both}.controls{position:fixed;left:50%;bottom:max(.85rem,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:.45rem;z-index:20}.controls button{border:1px solid rgba(23,21,19,.24);background:rgba(246,240,230,.86);color:#171513;border-radius:999px;padding:.48rem .62rem;font:700 .56rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}.label{position:fixed;top:max(.7rem,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font:700 .56rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(23,21,19,.44);z-index:20;white-space:nowrap}.num{position:fixed;left:50%;bottom:3.4rem;transform:translateX(-50%);font:600 .56rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:rgba(23,21,19,.36)}@keyframes ghostSnap{0%{opacity:.42;transform:translate(.035em,-.02em)}100%{opacity:0;transform:translate(0,0)}}@keyframes pressure{0%{letter-spacing:0;text-shadow:none}60%{letter-spacing:.018em;text-shadow:.03em 0 rgba(23,21,19,.22),-.025em 0 rgba(23,21,19,.14)}100%{letter-spacing:0;text-shadow:none}}@keyframes fracture{0%{transform:none;text-shadow:none}50%{transform:translate(.04em,-.02em);text-shadow:-.05em .03em rgba(23,21,19,.18)}100%{transform:translate(-.025em,.015em);text-shadow:.04em -.025em rgba(23,21,19,.16)}}@keyframes blackcut{0%{background:#171513;color:#f6f0e6}100%{background:transparent;color:inherit}}</style></head><body><main class="page"><div class="label">Thunderclap Lab · production typography</div><div class="inner"><div class="kicker">Foreword</div><div class="copy"><p>There was no <span id="target" class="tc">thunderclap</span>. No scientific instrument lit up and announced that a new category of being had entered the universe.</p><p>I just felt an enormous burst of joy.</p><p>I could have been wrong.</p></div></div><div class="num">| 05 |</div></main><nav class="controls"><button data-v="cut">A cut</button><button data-v="pressure">B pressure</button><button data-v="snap">C snap</button><button data-v="fracture">D fracture</button><button id="replay">Replay</button></nav><script>const target=document.getElementById('target'),buttons=[...document.querySelectorAll('[data-v]')];let variant='cut',timer;buttons.forEach(b=>b.onclick=()=>{variant=b.dataset.v;run()});document.getElementById('replay').onclick=run;function reset(){clearTimeout(timer);target.className='tc';target.innerHTML='thunderclap'}function run(){reset();void target.offsetWidth;if(variant==='cut'){timer=setTimeout(()=>target.classList.add('gone'),420)}else if(variant==='pressure'){target.classList.add('pressure');timer=setTimeout(()=>target.classList.add('gone'),520)}else if(variant==='snap'){const g=document.createElement('i');g.className='ghost';g.textContent='thunderclap';target.appendChild(g);target.classList.add('snap');timer=setTimeout(()=>target.classList.add('gone'),470)}else if(variant==='fracture'){target.classList.add('fracture');timer=setTimeout(()=>target.classList.add('gone'),500)}}setTimeout(run,900);</script></body></html>
