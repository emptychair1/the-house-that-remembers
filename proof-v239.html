<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The House That Remembers — v239 cover rollback bridge</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.stage{position:fixed;inset:0;background:#000;overflow:hidden}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:block}
.gate{position:fixed;inset:0;z-index:5;display:grid;place-items:end center;padding:0 1rem max(1.1rem,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,.62),transparent 34%);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .42s ease}
.gate.is-hidden{opacity:0;pointer-events:none}
.gate-label{font:700 .58rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,234,215,.55);text-align:center;text-shadow:0 0 .7rem rgba(0,0,0,.85)}
.build{position:fixed;z-index:6;left:.55rem;bottom:max(.45rem,env(safe-area-inset-bottom));font:700 .48rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:rgba(244,234,215,.44);pointer-events:none;text-transform:uppercase}
body.reader-mode .build{color:rgba(244,234,215,.18)}
</style>
</head>
<body>
<main class="stage" aria-label="The House That Remembers cover-to-rollback proof">
  <iframe id="proofFrame" class="frame" title="Approved cover proof" src="https://cdn.jsdelivr.net/gh/emptychair1/the-house-that-remembers@436e814/proof-motion.html?v=rosetta-stream-v6"></iframe>
  <button id="gate" class="gate" type="button" aria-label="Enter rollback reader">
    <span class="gate-label">tap to enter</span>
  </button>
  <div class="build">PROOF v239 COVER → v238 ROLLBACK</div>
</main>
<script>
const gate=document.getElementById('gate');
const frame=document.getElementById('proofFrame');
let entered=false;
function enter(){
  if(entered)return;
  entered=true;
  gate.classList.add('is-hidden');
  document.body.classList.add('reader-mode');
  frame.title='v238 rollback reader';
  frame.src='./proof-v238.html?v=rollback-6e5d105-from-v239';
}
gate.addEventListener('click',enter,{passive:true});
gate.addEventListener('touchend',enter,{passive:true});
</script>
</body>
</html>
