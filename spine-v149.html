<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The House That Remembers — Spine v1.49</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#000;overflow:hidden}iframe{display:block}</style></head><body><iframe id="book" src="./spine-v146.html?base=146" title="The House That Remembers"></iframe><script>
const LABEL='SPINE v1.49 · SINGLE DIAGNOSTIC OWNER';
function descend(win){let cur=win;for(let i=0;i<20;i++){const d=cur.document;if(!d)return null;const n=d.querySelector('#book');if(!n||!n.contentWindow)return {w:cur,d};cur=n.contentWindow;}return {w:cur,d:cur.document};}
function stamp(){try{const leaf=descend(root.contentWindow);if(!leaf)return false;const badges=leaf.d.querySelectorAll('.version-badge');if(!badges.length)return false;badges.forEach(b=>b.textContent=LABEL);return true}catch(e){return false}}
const root=document.querySelector('#book');root.addEventListener('load',()=>{let tries=0;const badgeTimer=setInterval(()=>{stamp();if(++tries>24)clearInterval(badgeTimer)},250);setTimeout(()=>{const leaf=descend(root.contentWindow);if(!leaf)return;const {w,d}=leaf;if(d.getElementById('p3-149')){stamp();return}const marker=d.createElement('meta');marker.id='p3-149';d.head.appendChild(marker);const scan=d.querySelector('.p3-diag-scan'),ro=d.querySelector('.p3-diag-readout');if(scan&&ro){let scene=false;const nativeAdd=scan.classList.add.bind(scan.classList),nativeRemove=scan.classList.remove.bind(scan.classList);scan.classList.add=(...names)=>{if(names.includes('live')){if(scene)return;scene=true}return nativeAdd(...names)};scan.classList.remove=(...names)=>{const r=nativeRemove(...names);if(names.includes('live'))w.setTimeout(()=>{scene=false},0);return r};let roScene=false;const roAdd=ro.classList.add.bind(ro.classList),roRemove=ro.classList.remove.bind(ro.classList);ro.classList.add=(...names)=>{if(names.includes('live')){if(roScene)return;roScene=true}return roAdd(...names)};ro.classList.remove=(...names)=>{const r=roRemove(...names);if(names.includes('live'))w.setTimeout(()=>{roScene=false},0);return r}}stamp()},500)});
</script></body></html>
