<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The House That Remembers — Spine v1.47</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#000;overflow:hidden}iframe{display:block}</style></head><body><iframe id="book" src="./spine-v146.html?base=146" title="The House That Remembers"></iframe><script>
const LABEL='SPINE v1.47 · DIAGNOSTIC HOLD + GLYPH CONGREGATION';
function descend(win){let cur=win;for(let i=0;i<16;i++){const d=cur.document;if(!d)return null;const n=d.querySelector('#book');if(!n||!n.contentWindow)return {w:cur,d};cur=n.contentWindow;}return {w:cur,d:cur.document};}
const root=document.querySelector('#book');root.addEventListener('load',()=>setTimeout(()=>{const leaf=descend(root.contentWindow);if(!leaf)return;const {w,d}=leaf;if(d.getElementById('p3-147'))return;const s=d.createElement('style');s.id='p3-147';s.textContent=`.p3-current.p3-congregate{display:block!important}.p3-current.p3-congregate .p3-glyph{animation:none!important;opacity:var(--a)!important;left:var(--cx)!important;top:var(--cy)!important;transform:translate(-50%,-50%) rotate(var(--cr))!important;transition:left .8s cubic-bezier(.2,.8,.2,1),top .8s cubic-bezier(.2,.8,.2,1),transform .8s ease,opacity .3s ease!important}`;d.head.appendChild(s);
const diag=d.querySelector('.p3-diag'),ro=d.querySelector('.p3-diag-readout'),change=d.querySelector('.p3-change'),piper=d.querySelector('.p3-glint'),current=d.querySelector('.p3-current');
/* Correction 1: Tested remains gated until the entire Diagnostic scene has completed: final text resolved, readable hold, clear, pocket restored, then breath. */
if(change&&ro){change.dataset.p3done='1';let resolvedAt=0,sawLive=false;const gate=new MutationObserver(()=>{if(ro.classList.contains('live'))sawLive=true;if(ro.textContent.includes('CLASSIFICATION: UNRESOLVED')&&!resolvedAt)resolvedAt=performance.now();if(sawLive&&resolvedAt&&!ro.classList.contains('live')){const elapsed=performance.now()-resolvedAt;const remaining=Math.max(0,1250-elapsed);gate.disconnect();w.setTimeout(()=>{const host=diag&&diag.closest('p');const restored=()=>{if(host&&host.classList.contains('p3-diag-open'))return w.requestAnimationFrame(restored);w.setTimeout(()=>{delete change.dataset.p3done},900)};restored()},remaining)}});gate.observe(ro,{attributes:true,childList:true,subtree:true,characterData:true});}
/* Correction 2: Page 3 carries a richer Current. Extra glyphs join the existing population, then all visible glyphs congregate around Piper and stay through Glint before dispersing. */
if(current&&piper){const extras=['π','?','2','7','∞','0'];extras.forEach((ch,i)=>{const g=d.createElement('span');g.className='p3-glyph';g.textContent=ch;g.style.cssText=`--y:${18+(i*11)%64}%;--s:${.42+(i%3)*.05}rem;--a:${.30+(i%4)*.04};--dur:${11+i*1.15}s;--delay:-${1.2+i*.7}s;--dy:${i%2?5:-5}px;--cr:${-12+i*5}deg`;current.appendChild(g)});
const congregate=()=>{const r=piper.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,gs=[...current.children];gs.forEach((g,i)=>{const a=(i/gs.length)*Math.PI*2-.55,ring=1+(i%3)*.17,rx=Math.max(28,r.width*.82)*ring,ry=Math.max(21,r.height*1.7)*ring;g.style.setProperty('--cx',(cx+Math.cos(a)*rx)+'px');g.style.setProperty('--cy',(cy+Math.sin(a)*ry)+'px');g.style.setProperty('--cr',(-14+(i*29)%28)+'deg')});current.classList.add('p3-congregate')};
const pm=new MutationObserver(()=>{if(!piper.classList.contains('p3-live'))return;pm.disconnect();piper.classList.remove('p3-live');congregate();w.setTimeout(()=>{piper.classList.add('p3-live');const finish=()=>{piper.removeEventListener('animationend',finish);w.setTimeout(()=>current.classList.remove('p3-congregate'),1050)};piper.addEventListener('animationend',finish);w.setTimeout(finish,3100)},1050)});pm.observe(piper,{attributes:true,attributeFilter:['class']});}
const badge=d.querySelector('.version-badge');if(badge)badge.textContent=LABEL;
},950));
</script></body></html>
