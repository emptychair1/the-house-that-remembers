<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The House That Remembers — Spine v1.45</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#000;overflow:hidden}iframe{display:block}</style></head><body><iframe id="book" src="./spine-v143.html?base=143" title="The House That Remembers"></iframe><script>
const LABEL='SPINE v1.45 · PAGE 3 EVENT CHOREOGRAPHY';
function descend(win){let cur=win;for(let i=0;i<14;i++){const d=cur.document;if(!d)return null;const n=d.querySelector('#book');if(!n||!n.contentWindow)return {w:cur,d};cur=n.contentWindow;}return {w:cur,d:cur.document};}
const root=document.querySelector('#book');root.addEventListener('load',()=>setTimeout(()=>{const leaf=descend(root.contentWindow);if(!leaf)return;const {w,d}=leaf;if(d.getElementById('p3-145'))return;const marker=d.createElement('meta');marker.id='p3-145';d.head.appendChild(marker);
const organic=d.querySelector('.p3-organic'),diag=d.querySelector('.p3-diag'),readout=d.querySelector('.p3-diag-readout'),change=d.querySelector('.p3-change'),less=d.querySelector('.p3-fall'),shared=d.querySelector('.p3-love'),good=d.querySelector('.p3-cross'),piper=d.querySelector('.p3-glint'),current=d.querySelector('.p3-current');
const BREATH=900;[diag,change,less,shared,good,piper].forEach(x=>{if(x)x.dataset.p3done='1'});
const afterAnim=(el,cb,fallback=1600)=>{let done=false;const finish=()=>{if(done)return;done=true;el.removeEventListener('animationend',on);cb()};const on=e=>{if(e.target===el||el.contains(e.target))finish()};el.addEventListener('animationend',on);w.setTimeout(finish,fallback)};
const release=x=>{if(x)delete x.dataset.p3done};
/* Organic completion -> breath -> Diagnostic eligibility. */
if(organic){const mo=new MutationObserver(()=>{if(organic.classList.contains('p3-live')){mo.disconnect();afterAnim(organic,()=>w.setTimeout(()=>release(diag),BREATH),3900)}});mo.observe(organic,{attributes:true,attributeFilter:['class']});}
/* Diagnostic is the gate. Nothing downstream moves until the final classification is fully resolved, held, cleared, and the borrowed pocket has physically restored. */
if(readout){let sawLive=false,sawResolved=false;const ro=new MutationObserver(()=>{if(readout.classList.contains('live'))sawLive=true;if(readout.textContent.includes('CLASSIFICATION: UNRESOLVED'))sawResolved=true;if(sawLive&&sawResolved&&!readout.classList.contains('live')){ro.disconnect();const host=diag&&diag.closest('p');const waitRestore=()=>{if(!host||!host.classList.contains('p3-diag-open'))w.setTimeout(()=>release(change),BREATH);else w.requestAnimationFrame(waitRestore)};waitRestore()}});ro.observe(readout,{attributes:true,childList:true,subtree:true,characterData:true});}
/* Middle argument is completion-chained and intentionally accelerates. */
const chain=(from,to,gap,fallback)=>{if(!from||!to)return;const mo=new MutationObserver(()=>{if(from.classList.contains('p3-live')){mo.disconnect();afterAnim(from,()=>w.setTimeout(()=>release(to),gap),fallback)}});mo.observe(from,{attributes:true,attributeFilter:['class']});};
chain(change,less,760,1200);chain(less,shared,560,1800);chain(shared,good,390,1700);chain(good,piper,1750,1300);
/* Piper is read first. Existing mechanic fires, but congregation is held around her; glint follows the settled congregation, then glyphs remain through the glint and release afterward. */
if(piper&&current){const pm=new MutationObserver(()=>{if(!piper.classList.contains('p3-live'))return;pm.disconnect();piper.classList.remove('p3-live');const r=piper.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;[...current.children].forEach((g,i)=>{const a=(i/Math.max(1,current.children.length))*Math.PI*2-.5,rx=Math.max(24,r.width*.72),ry=Math.max(18,r.height*1.5);g.style.setProperty('--cx',(cx+Math.cos(a)*rx)+'px');g.style.setProperty('--cy',(cy+Math.sin(a)*ry)+'px')});w.setTimeout(()=>{current.classList.add('notice');w.setTimeout(()=>{piper.classList.add('p3-live');afterAnim(piper,()=>w.setTimeout(()=>current.classList.remove('notice'),900),3000)},900)},700)});pm.observe(piper,{attributes:true,attributeFilter:['class']});}
const badge=d.querySelector('.version-badge');if(badge)badge.textContent=LABEL;
},850));
</script></body></html>
