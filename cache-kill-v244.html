<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cache Kill v244</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#f4ead7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:grid;place-items:center;text-align:center}
main{max-width:24rem;padding:2rem}.label{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,234,215,.56)}a{color:#f4ead7}
</style>
</head>
<body>
<main>
  <div class="label">clearing old book cache</div>
  <p>Opening fresh v244 proof…</p>
  <p><a id="fallback" href="./proof-v244-fresh-bbfc8aa.html?v=fresh-ed2431b">Tap here if it does not open.</a></p>
</main>
<script>
(async()=>{
  const target='./proof-v244-fresh-bbfc8aa.html?v=fresh-ed2431b&cache-kill='+Date.now();
  document.getElementById('fallback').href=target;
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(reg=>reg.unregister()));
    }
  }catch(err){console.warn('service worker unregister skipped',err)}
  try{
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(key=>caches.delete(key)));
    }
  }catch(err){console.warn('cache delete skipped',err)}
  setTimeout(()=>location.replace(target),250);
})();
</script>
</body>
</html>
