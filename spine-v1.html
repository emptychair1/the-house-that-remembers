<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-store,max-age=0">
<title>The House That Remembers — Spine v1.7</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Baskerville,"Iowan Old Style",Georgia,serif}body{height:100dvh;touch-action:none}.stage{position:fixed;inset:0;background:#000;overflow:hidden}.book{width:100vw;height:100dvh}.page{position:relative;width:100%;height:100%;overflow:hidden}.cover{background:#000!important}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}.foreword{background:#f6f0e6;color:#171513;display:flex;align-items:flex-start;justify-content:center;padding:10vh 8vw 7vh}.foreword-inner{width:100%;max-width:42rem;text-align:center}.kicker{font:700 .72rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.28em;text-transform:uppercase;opacity:.52;margin-bottom:2rem}.foreword h1{font-weight:400;font-size:clamp(2.8rem,10vw,5.4rem);line-height:.98;margin:0}.subtitle{font-size:clamp(1.15rem,4.8vw,1.7rem);letter-spacing:.08em;opacity:.62;margin:1.3rem 0 0}.opening{font-size:clamp(1.1rem,4.4vw,1.45rem);line-height:1.5;margin:4rem auto 0;max-width:34rem;color:rgba(23,21,19,.72)}.void{background:#000}.void-ring{position:absolute;left:50%;top:50%;width:2.6rem;height:2.6rem;border:1px solid rgba(255,255,255,.28);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 1.2rem rgba(255,255,255,.08)}#glyph-overlay{position:fixed;z-index:700;pointer-events:none;display:block}.tap-left,.tap-right{position:fixed;top:0;bottom:0;width:36vw;z-index:999;background:transparent;border:0;padding:0;-webkit-tap-highlight-color:transparent}.tap-left{left:0}.tap-right{right:0}.status{position:fixed;left:50%;bottom:max(.75rem,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:1000;font:700 .52rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.28);pointer-events:none;white-space:nowrap}.version-badge{position:fixed;z-index:1100;left:.7rem;top:max(.7rem,env(safe-area-inset-top));padding:.42rem .55rem;border:1px solid rgba(255,255,255,.18);border-radius:.32rem;background:rgba(0,0,0,.72);font:700 .56rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72);pointer-events:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
</style>
</head>
<body>
<div class="version-badge">SPINE v1.7 · GLYPH OVERLAY</div>
<div class="stage">
  <div id="book" class="book">
    <section class="page cover" aria-label="Cover">
      <img src="./assets/source/IMG_3301.png?v=spine-v1.7" alt="The House That Remembers cover">
    </section>
    <section class="page foreword" aria-label="Foreword">
      <div class="foreword-inner">
        <div class="kicker">Foreword</div>
        <h1>Possibility<br>and Curiosity</h1>
        <div class="subtitle">The House That Remembers</div>
        <p class="opening">There are moments in human history when the important thing is not that we have found an answer.</p>
      </div>
    </section>
    <section class="page void" aria-label="Void arrival">
      <div class="void-ring" aria-hidden="true"></div>
    </section>
  </div>
</div>
<canvas id="glyph-overlay" aria-hidden="true"></canvas>
<button class="tap-left" aria-label="Previous page"></button>
<button class="tap-right" aria-label="Next page"></button>
<div id="status" class="status">1 / 3</div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
(() => {
  const pages=[...document.querySelectorAll('.page')];
  const book=document.getElementById('book');
  const cover=document.querySelector('.cover');
  const status=document.getElementById('status');
  const canvas=document.getElementById('glyph-overlay');
  const ctx=canvas.getContext('2d');
  let current=0;

  const pf=new St.PageFlip(book,{
    width:390,
    height:844,
    size:'stretch',
    minWidth:300,
    maxWidth:1000,
    minHeight:520,
    maxHeight:1600,
    autoSize:true,
    usePortrait:true,
    showCover:true,
    startPage:0,
    flippingTime:700,
    drawShadow:true,
    maxShadowOpacity:.32,
    mobileScrollSupport:false
  });
  pf.loadFromHTML(pages);

  const PI='31415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679';
  const stream=[];
  let w=0,h=0,dpr=1,start=0;
  const hash=n=>{const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)};

  function syncOverlay(){
    if(current!==0){canvas.style.display='none';return;}
    canvas.style.display='block';
    const r=cover.getBoundingClientRect();
    if(!r.width||!r.height)return;
    canvas.style.left=r.left+'px';
    canvas.style.top=r.top+'px';
    canvas.style.width=r.width+'px';
    canvas.style.height=r.height+'px';
    w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.round(w*dpr));
    canvas.height=Math.max(1,Math.round(h*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    stream.length=0;
    const count=Math.max(150,Math.min(300,Math.round(w*h/1900)));
    for(let i=0;i<count;i++)stream.push({offset:hash(i+1),lane:hash(i+101),speed:.035+hash(i+201)*.05,size:.72+hash(i+301)*.58,alpha:.22+hash(i+401)*.44,digit:PI[i%PI.length]});
  }

  function setPage(i){
    current=Math.max(0,Math.min(2,Number(i)||0));
    status.textContent=`${current+1} / 3`;
    requestAnimationFrame(syncOverlay);
  }
  pf.on('flip',e=>setPage(e.data));
  document.querySelector('.tap-right').addEventListener('pointerup',e=>{e.preventDefault();if(current<2)pf.flipNext();});
  document.querySelector('.tap-left').addEventListener('pointerup',e=>{e.preventDefault();if(current>0)pf.flipPrev();});
  addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&current<2)pf.flipNext();if(e.key==='ArrowLeft'&&current>0)pf.flipPrev();});

  function draw(ts){
    if(!start)start=ts;
    const t=(ts-start)/1000;
    if(current===0&&w&&h){
      ctx.clearRect(0,0,w,h);
      const ax=-w*.04, ay=h*.43;
      const bx=w*.48, by=h*.57;
      const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1;
      const nx=-dy/len, ny=dx/len;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalCompositeOperation='screen';
      for(let i=0;i<stream.length;i++){
        const p=stream[i];
        const travel=(p.offset+t*p.speed)%1;
        const width=w*(.14*(1-travel)+.025);
        const lane=(p.lane-.5)*2;
        const wobble=Math.sin(t*1.5+i*.31)*w*.004;
        const x=ax+dx*travel+nx*lane*width+wobble;
        const y=ay+dy*travel+ny*lane*width+Math.cos(t*1.1+i)*h*.0025;
        const env=Math.sin(Math.PI*travel);
        const alpha=Math.max(0,Math.min(.72,p.alpha*env));
        if(alpha<.02)continue;
        ctx.font=`${Math.max(5,w*.0088*p.size)}px ui-monospace,SFMono-Regular,Menlo,monospace`;
        ctx.fillStyle=`rgba(255,255,255,${alpha})`;
        ctx.fillText(p.digit,x,y);
      }
    }
    requestAnimationFrame(draw);
  }

  requestAnimationFrame(syncOverlay);
  setTimeout(syncOverlay,120);
  setTimeout(syncOverlay,450);
  addEventListener('resize',()=>requestAnimationFrame(syncOverlay),{passive:true});
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
