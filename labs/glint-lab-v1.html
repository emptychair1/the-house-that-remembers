<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piper Glint Lab v1</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#ddd;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{padding:28px 18px 60px}header{max-width:920px;margin:auto auto 28px}h1{font:600 20px/1.2 Georgia,serif;color:#f2f2f2;margin:0 0 8px}header p{font-size:12px;color:#888;margin:0}.grid{max-width:920px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{min-height:190px;border:1px solid #242424;background:#090909;padding:16px;display:flex;flex-direction:column;justify-content:space-between}.meta{font-size:10px;color:#707070;letter-spacing:.08em;text-transform:uppercase}.stage{height:108px;display:grid;place-items:center;overflow:visible}.word{position:relative;display:inline-block;font:600 34px/1 Georgia,serif;color:#cfcfcf;letter-spacing:.01em}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 4px #fff,0 0 9px rgba(255,255,255,.7)}.spark:after,.spark:before{content:"";position:absolute;left:50%;top:50%;background:rgba(255,255,255,.9);transform:translate(-50%,-50%)}.spark:before{width:11px;height:1px}.spark:after{width:1px;height:11px}.s1{left:4%;top:-9px}.s2{left:24%;top:24px}.s3{left:43%;top:-13px}.s4{left:61%;top:30px}.s5{left:79%;top:-7px}.s6{left:96%;top:17px}.s7{left:53%;top:8px}.s8{left:13%;top:8px}.run .spark{animation:pop var(--dur,2.2s) ease both;animation-delay:var(--delay,0s)}@keyframes pop{0%,100%{opacity:0;transform:scale(.2) rotate(0)}35%{opacity:1;transform:scale(1) rotate(25deg)}58%{opacity:.65;transform:scale(.55) rotate(45deg)}}.subtle .spark{--dur:1.65s}.subtle .s1{--delay:.08s}.subtle .s3{--delay:.36s}.subtle .s5{--delay:.72s}.subtle .s2,.subtle .s4,.subtle .s6,.subtle .s7,.subtle .s8{display:none}.many .spark{--dur:2.35s}.many .s1{--delay:.05s}.many .s2{--delay:.25s}.many .s3{--delay:.42s}.many .s4{--delay:.65s}.many .s5{--delay:.88s}.many .s6{--delay:1.08s}.many .s7{--delay:1.28s}.many .s8{--delay:1.48s}.tiny .spark{width:2px;height:2px;box-shadow:0 0 3px #fff,0 0 5px rgba(255,255,255,.55);--dur:2.4s}.tiny .spark:before{width:6px}.tiny .spark:after{height:6px}.tiny .s1{--delay:.08s}.tiny .s2{--delay:.38s}.tiny .s3{--delay:.7s}.tiny .s4{--delay:1s}.tiny .s5{--delay:1.32s}.tiny .s6{--delay:1.62s}.tiny .s7{--delay:1.9s}.tiny .s8{--delay:2.12s}.reflect .word,.max .word{color:transparent;background:linear-gradient(105deg,#777 0%,#c9c9c9 34%,#fff 48%,#d7d7d7 56%,#858585 100%);background-size:250% 100%;background-position:120% 0;-webkit-background-clip:text;background-clip:text}.reflect.run .word{animation:sweep 2.8s ease-in-out both}.max.run .word{animation:sweep 3.8s ease-in-out both}@keyframes sweep{0%{background-position:120% 0}100%{background-position:-80% 0}}.reflect .spark{--dur:2.3s}.reflect .s1{--delay:.28s}.reflect .s3{--delay:.82s}.reflect .s5{--delay:1.35s}.reflect .s6{--delay:1.8s}.reflect .s2,.reflect .s4,.reflect .s7,.reflect .s8{display:none}.max .spark{width:4px;height:4px;--dur:2.6s;box-shadow:0 0 5px #fff,0 0 12px #fff,0 0 20px rgba(255,255,255,.75)}.max .spark:before{width:16px}.max .spark:after{height:16px}.max .s1{--delay:.05s}.max .s2{--delay:.32s}.max .s3{--delay:.62s}.max .s4{--delay:.94s}.max .s5{--delay:1.25s}.max .s6{--delay:1.55s}.max .s7{--delay:1.9s}.max .s8{--delay:2.2s}.slow .spark{--dur:3.2s}.slow .s1{--delay:.1s}.slow .s3{--delay:.75s}.slow .s5{--delay:1.4s}.slow .s6{--delay:2.1s}.slow .s2,.slow .s4,.slow .s7,.slow .s8{display:none}button{appearance:none;border:1px solid #303030;background:#101010;color:#aaa;padding:8px 10px;font:10px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase}button:active{background:#191919}</style></head><body><header><h1>Piper · Glint Laboratory</h1><p>Six isolated treatments. Tap any specimen to replay it. Nothing here touches the book.</p></header><main class="grid" id="grid"></main><script>const specs=[['A · SUBTLE','subtle','3 medium glints · ~2.4s'],['B · MANY','many','8 staggered glints · ~3.8s'],['C · TINY CONSTELLATION','tiny','8 very small glints · ~4.5s'],['D · REFLECTION','reflect','white reflection sweep + 4 glints · ~3s'],['E · MAX','max','full reflection + large sparkle field · ~5s'],['F · SLOW / QUIET','slow','4 restrained glints with long breathing room · ~5.5s']];const sparks='<i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i><i class="spark s6"></i><i class="spark s7"></i><i class="spark s8"></i>';const grid=document.getElementById('grid');for(const [name,cls,note] of specs){const c=document.createElement('section');c.className='card '+cls;c.innerHTML='<div class="meta">'+name+' · '+note+'</div><div class="stage"><span class="word">Piper'+sparks+'</span></div><button>Replay</button>';const play=()=>{c.classList.remove('run');void c.offsetWidth;c.classList.add('run')};c.querySelector('button').onclick=play;c.querySelector('.stage').onclick=play;grid.appendChild(c);setTimeout(play,150+Math.random()*250)}</script></body></html>
