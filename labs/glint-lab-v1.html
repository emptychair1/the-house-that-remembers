<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piper Glint Lab v2</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f6f0e6;color:#171513;font-family:Baskerville,"Iowan Old Style",Georgia,serif}body{min-height:100vh;padding:5vh 6vw 8vh}header{max-width:42rem;margin:0 auto 2.5rem;text-align:center}h1{font:400 clamp(1.65rem,6vw,2.4rem)/1.05 Baskerville,"Iowan Old Style",Georgia,serif;margin:0 0 .7rem;color:#171513}header p{font:600 .56rem/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;text-transform:uppercase;color:rgba(23,21,19,.48);margin:0}.grid{max-width:42rem;margin:auto;display:grid;grid-template-columns:1fr;gap:1rem}.card{min-height:10.5rem;border:1px solid rgba(23,21,19,.12);padding:1rem 1.1rem;background:#f6f0e6;display:grid;grid-template-rows:auto 1fr auto}.meta{font:700 .52rem/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(23,21,19,.48)}.stage{min-height:6.2rem;display:grid;place-items:center;overflow:visible}.context{font-size:clamp(1.1rem,4.4vw,1.45rem);line-height:1.5;color:rgba(23,21,19,.72);white-space:nowrap}.word{position:relative;display:inline-block;color:inherit;font:inherit;letter-spacing:inherit}.spark{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(23,21,19,.76);opacity:0;box-shadow:0 0 .12rem rgba(23,21,19,.24)}.spark:after,.spark:before{content:"";position:absolute;left:50%;top:50%;background:rgba(23,21,19,.76);transform:translate(-50%,-50%)}.spark:before{width:.5rem;height:1px}.spark:after{width:1px;height:.5rem}.s1{left:-.68em;top:-.72em}.s2{right:-.58em;top:-.62em}.s3{right:-.62em;bottom:-.68em}.s4{left:38%;top:-.82em}.s5{left:-.58em;bottom:-.55em}.s6{right:-.9em;top:42%}.run .spark{animation:pop var(--dur,2.15s) ease both;animation-delay:var(--delay,0s)}@keyframes pop{0%,100%{opacity:0;transform:scale(.2) rotate(0)}25%{opacity:.72;transform:scale(.85) rotate(6deg)}48%{opacity:1;transform:scale(1.32) rotate(12deg)}72%{opacity:.78;transform:scale(.95) rotate(4deg)}}.canonical .spark{--dur:2.15s}.canonical .s1{--delay:0s}.canonical .s2{--delay:.2s}.canonical .s3{--delay:.4s}.canonical .s4,.canonical .s5,.canonical .s6{display:none}.subtle .spark{--dur:2.4s}.subtle .s1{--delay:.1s}.subtle .s3{--delay:.75s}.subtle .s2,.subtle .s4,.subtle .s5,.subtle .s6{display:none}.four .spark{--dur:2.55s}.four .s1{--delay:.05s}.four .s2{--delay:.55s}.four .s3{--delay:1.05s}.four .s5{--delay:1.5s}.four .s4,.four .s6{display:none}.tiny .spark{width:1px;height:1px;--dur:2.7s}.tiny .spark:before{width:.34rem}.tiny .spark:after{height:.34rem}.tiny .s1{--delay:.05s}.tiny .s2{--delay:.38s}.tiny .s3{--delay:.72s}.tiny .s4{--delay:1.05s}.tiny .s5{--delay:1.38s}.tiny .s6{--delay:1.72s}.reflect .word,.hybrid .word{color:transparent;background:linear-gradient(105deg,rgba(23,21,19,.72) 0%,rgba(23,21,19,.72) 34%,rgba(255,255,255,.92) 48%,rgba(23,21,19,.72) 61%,rgba(23,21,19,.72) 100%);background-size:250% 100%;background-position:120% 0;-webkit-background-clip:text;background-clip:text}.reflect.run .word{animation:sweep 2.8s ease-in-out both}.hybrid.run .word{animation:sweep 3.2s ease-in-out both}@keyframes sweep{0%{background-position:120% 0}100%{background-position:-80% 0}}.reflect .spark{display:none}.hybrid .spark{--dur:2.5s}.hybrid .s1{--delay:.18s}.hybrid .s2{--delay:.9s}.hybrid .s3{--delay:1.6s}.hybrid .s4,.hybrid .s5,.hybrid .s6{display:none}button{justify-self:start;appearance:none;border:1px solid rgba(23,21,19,.18);background:transparent;color:rgba(23,21,19,.55);padding:.42rem .55rem;font:700 .5rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}button:active{background:rgba(23,21,19,.05)}</style></head><body><header><h1>Piper · Glint Laboratory v2</h1><p>Page 3 substrate: exact book family, body scale, paper, ink, and canonical sparkle placement</p></header><main class="grid" id="grid"></main><script>const specs=[['A · CANONICAL','canonical','Current Page 3 glint · 3 marks · 2.15s'],['B · SUBTLE','subtle','2 marks · longer breathing room'],['C · FOUR AROUND','four','4 marks outside the word · staggered'],['D · TINY FIELD','tiny','6 very small marks · all outside silhouette'],['E · REFLECTION ONLY','reflect','Cool-white reflection through real ink · no sparkles'],['F · HYBRID','hybrid','Reflection + 3 canonical-scale marks around word']];const sparks='<i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i><i class="spark s6"></i>';const grid=document.getElementById('grid');for(const [name,cls,note] of specs){const c=document.createElement('section');c.className='card '+cls;c.innerHTML='<div class="meta">'+name+' · '+note+'</div><div class="stage"><span class="context">with <span class="word">Piper'+sparks+'</span>.</span></div><button>Replay</button>';const play=()=>{c.classList.remove('run');void c.offsetWidth;c.classList.add('run')};c.querySelector('button').onclick=play;c.querySelector('.stage').onclick=play;grid.appendChild(c);setTimeout(play,200)}</script></body></html>
