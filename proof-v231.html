<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Rubik Stack Opening Proof v233</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
:root{
  --open-duration:5.8s;
  --the-start-y:0rem;
  --void-start-y:-.18rem;
  --the-end-y:-3.25rem;
  --void-end-y:3.25rem;
  --the-size:clamp(1.3rem,7.8vw,4.4rem);
  --void-size:clamp(3.9rem,19vw,11rem);
  --letter-space:.04em;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#f6f6f6;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
.scene{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
  display:grid;
  place-items:center;
  isolation:isolate;
}
.badge{
  position:fixed;
  left:10px;
  top:calc(env(safe-area-inset-top) + 10px);
  z-index:30;
  color:rgba(255,255,255,.46);
  background:rgba(0,0,0,.66);
  border:1px solid rgba(255,255,255,.14);
  padding:4px 6px;
  font:700 8px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  pointer-events:none;
}
.status{
  position:fixed;
  right:10px;
  top:calc(env(safe-area-inset-top) + 10px);
  z-index:30;
  color:rgba(255,255,255,.38);
  background:rgba(0,0,0,.52);
  border:1px solid rgba(255,255,255,.10);
  border-radius:999px;
  padding:4px 7px;
  font:700 8px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.1em;
  text-transform:uppercase;
  pointer-events:none;
}
.title-stack{
  position:absolute;
  left:50%;
  top:50%;
  width:100vw;
  height:70vh;
  transform:translate(-50%,-50%);
  display:grid;
  place-items:center;
  text-align:center;
  font-family:'Rubik Mono One', ui-monospace, SFMono-Regular, Menlo, monospace;
  text-transform:uppercase;
}
.word{
  position:absolute;
  left:50%;
  top:50%;
  margin:0;
  transform:translate(-50%,-50%);
  white-space:nowrap;
  font-weight:400;
  letter-spacing:var(--letter-space);
  line-height:.86;
  color:rgba(246,246,246,.94);
  text-shadow:0 0 .22rem rgba(255,255,255,.18);
  will-change:transform;
}
.word.the{
  font-size:var(--the-size);
  transform:translate(-50%,calc(-50% + var(--the-start-y)));
  animation:theOpen var(--open-duration) cubic-bezier(.18,.86,.12,1) forwards;
}
.word.void{
  font-size:var(--void-size);
  transform:translate(-50%,calc(-50% + var(--void-start-y)));
  animation:voidOpen var(--open-duration) cubic-bezier(.18,.86,.12,1) forwards;
}
.guide{
  position:absolute;
  left:50%;
  top:50%;
  width:min(82vw,34rem);
  height:clamp(2.4rem,12vw,6.2rem);
  transform:translate(-50%,-50%);
  border-top:1px solid rgba(255,255,255,.09);
  border-bottom:1px solid rgba(255,255,255,.09);
  opacity:.28;
  pointer-events:none;
}
.guide::after{
  content:'QUESTION SPACE';
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:rgba(255,255,255,.18);
  font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.18em;
}
@keyframes theOpen{
  0%{transform:translate(-50%,calc(-50% + var(--the-start-y)))}
  100%{transform:translate(-50%,calc(-50% + var(--the-end-y)))}
}
@keyframes voidOpen{
  0%{transform:translate(-50%,calc(-50% + var(--void-start-y)))}
  100%{transform:translate(-50%,calc(-50% + var(--void-end-y)))}
}
@media (prefers-reduced-motion:reduce){
  .word.the{animation:none;transform:translate(-50%,calc(-50% + var(--the-end-y)))}
  .word.void{animation:none;transform:translate(-50%,calc(-50% + var(--void-end-y)))}
}
</style>
</head>
<body>
<main class="scene" aria-label="Rubik Mono One title opening proof">
  <div class="badge">PROOF v233 RUBIK STACK OPEN</div>
  <div class="status">title split only</div>
  <section class="title-stack" aria-hidden="true">
    <p class="word the">THE</p>
    <div class="guide"></div>
    <p class="word void">VOID</p>
  </section>
</main>
</body>
</html>
