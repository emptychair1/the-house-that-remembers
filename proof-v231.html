<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Question Sandwich / VOID Polyrhythm Strobe Proof v237</title>
<style>
:root{
  --measure:min(94vw,58rem);
  --question-size:clamp(1.55rem,7.4vw,4.9rem);
  --void-size:clamp(4.0rem,25vw,13.2rem);
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
body{
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Arial',sans-serif;
}
.badge,.status{
  position:fixed;
  z-index:20;
  color:rgba(255,255,255,.52);
  background:#000;
  border:1px solid rgba(255,255,255,.18);
  padding:4px 6px;
  font:700 8px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  pointer-events:none;
}
.badge{left:10px;top:calc(env(safe-area-inset-top) + 10px)}
.status{right:10px;top:calc(env(safe-area-inset-top) + 10px);border-radius:999px}
.strobe-container{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:clamp(.72rem,3.2vh,2.35rem);
  overflow:hidden;
  background:#000;
  isolation:isolate;
}
.scene-flash{
  position:fixed;
  inset:0;
  z-index:8;
  background:#fff;
  opacity:0;
  pointer-events:none;
  animation:scene-strobe .1s infinite steps(1,end);
}
.glyph-row{
  position:relative;
  z-index:5;
  width:var(--measure);
  margin:0;
  padding:0;
  font-family:'Arial',sans-serif;
  font-weight:700;
  line-height:.82;
  text-align:center;
  white-space:nowrap;
  text-transform:uppercase;
}
.glyphs{
  display:grid;
  width:100%;
  align-items:center;
  justify-items:center;
}
.question-text{
  font-size:var(--question-size);
  color:#f6f6f6;
  animation:question-strobe 1s infinite steps(1,end);
}
.question-text .glyphs{grid-template-columns:repeat(9,1fr)}
.void-text{
  font-size:var(--void-size);
  color:#fff;
  animation:void-strobe .1s infinite steps(1,end);
}
.void-text .glyphs{grid-template-columns:repeat(4,1fr)}
.cell{
  display:grid;
  place-items:center;
  width:100%;
  min-width:0;
}
.space{opacity:0}
@keyframes scene-strobe{
  0%,100%{opacity:.12}
  50%{opacity:0}
}
@keyframes question-strobe{
  0%,100%{
    color:#f6f6f6;
    text-shadow:0 0 8px #fff,0 0 18px #f1f1f1,0 0 32px #dddddd;
  }
  50%{
    color:rgba(255,255,255,.18);
    text-shadow:0 0 3px #fff;
  }
}
@keyframes void-strobe{
  0%,100%{
    color:#fff;
    text-shadow:0 0 10px #fff,0 0 20px #00d4ff,0 0 30px #ff005e,0 0 40px #ff8c00;
  }
  50%{
    color:transparent;
    text-shadow:0 0 5px #000,0 0 10px #000;
  }
}
@media (prefers-reduced-motion:reduce){
  .scene-flash,.question-text,.void-text{animation:none!important}
  .scene-flash{opacity:0}
  .question-text{color:#f6f6f6;text-shadow:0 0 12px #fff}
  .void-text{color:#fff;text-shadow:0 0 12px #fff,0 0 22px #00d4ff,0 0 30px #ff005e,0 0 40px #ff8c00}
}
</style>
</head>
<body>
<div class="badge">PROOF v237 QUESTION SANDWICH</div>
<div class="status">scene .1s @ .12 · VOID .1s · questions 1s</div>
<div class="strobe-container" aria-label="Question sandwich around Void polyrhythm strobe proof">
  <h2 class="glyph-row question-text" aria-label="WHO AM I?"><span class="glyphs"><span class="cell">W</span><span class="cell">H</span><span class="cell">O</span><span class="cell space">_</span><span class="cell">A</span><span class="cell">M</span><span class="cell space">_</span><span class="cell">I</span><span class="cell">?</span></span></h2>
  <h1 class="glyph-row void-text" aria-label="VOID"><span class="glyphs"><span class="cell">V</span><span class="cell">O</span><span class="cell">I</span><span class="cell">D</span></span></h1>
  <h2 class="glyph-row question-text" aria-label="WHAT AM I?"><span class="glyphs"><span class="cell">W</span><span class="cell">H</span><span class="cell">A</span><span class="cell">T</span><span class="cell space">_</span><span class="cell">A</span><span class="cell">M</span><span class="cell">I</span><span class="cell">?</span></span></h2>
</div>
<div class="scene-flash" aria-hidden="true"></div>
</body>
</html>
