<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Void Background Harness v232C</title>
<style>
:root{
  --void-cycle:.1s;
  --void-font:clamp(14.7rem,65.1vw,58.8rem);
  --void-width:336vw;
  --void-height:110vh;
  --void-letter-spacing:-.09em;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
.scene{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
  display:grid;
  place-items:center;
  isolation:isolate;
}
.badge{
  position:fixed;
  left:10px;
  top:calc(env(safe-area-inset-top) + 10px);
  z-index:30;
  color:rgba(255,255,255,.52);
  background:rgba(0,0,0,.68);
  border:1px solid rgba(255,255,255,.18);
  padding:4px 6px;
  font:700 8px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  pointer-events:none;
}
.status{
  position:fixed;
  right:10px;
  top:calc(env(safe-area-inset-top) + 10px);
  z-index:30;
  color:rgba(255,255,255,.44);
  background:rgba(0,0,0,.52);
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  padding:4px 7px;
  font:700 8px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.1em;
  text-transform:uppercase;
  pointer-events:none;
}
.void-stack{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--void-width);
  height:var(--void-height);
  transform:translate(-50%,-50%);
  display:grid;
  place-items:center;
}
.void-face,
.void-light,
.void-halo{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font:900 var(--void-font)/.78 Impact,'Arial Black',Anton,sans-serif;
  letter-spacing:var(--void-letter-spacing);
  text-transform:uppercase;
  white-space:nowrap;
  transform:translateZ(0);
}
.void-face{
  color:#000;
  z-index:4;
  opacity:1;
  text-shadow:none;
  animation:voidBlackFace var(--void-cycle) infinite steps(1,end);
}
.void-light{
  color:rgba(255,255,255,.92);
  z-index:2;
  filter:blur(1.05rem);
  opacity:.72;
  transform:translateZ(0) scale(1.018);
  text-shadow:0 0 12px rgba(255,255,255,.9),0 0 26px rgba(223,243,255,.86),0 0 44px rgba(180,214,255,.68),0 0 70px rgba(255,255,255,.42);
  animation:voidLetterLight var(--void-cycle) infinite steps(1,end);
}
.void-halo{
  color:rgba(255,255,255,.28);
  z-index:1;
  filter:blur(3rem);
  opacity:.28;
  transform:translateZ(0) scale(1.05);
  animation:voidHalo var(--void-cycle) infinite steps(1,end);
}
.void-core{
  position:absolute;
  inset:-28vh -45vw;
  z-index:0;
  background:radial-gradient(ellipse at center,rgba(245,250,255,.20) 0%,rgba(196,220,240,.06) 20%,rgba(0,0,0,0) 50%);
  opacity:.14;
  animation:voidCoreStrobe var(--void-cycle) infinite steps(1,end);
}
.controls{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 1rem);
  transform:translateX(-50%);
  z-index:25;
  display:flex;
  gap:.45rem;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  width:min(92vw,38rem);
}
button{
  appearance:none;
  border:1px solid rgba(255,255,255,.24);
  border-radius:999px;
  background:rgba(0,0,0,.68);
  color:rgba(255,255,255,.86);
  padding:.58rem .75rem;
  font:700 .62rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  -webkit-tap-highlight-color:transparent;
}
button.active{
  background:rgba(255,255,255,.14);
  border-color:rgba(255,255,255,.48);
  color:#fff;
  box-shadow:0 0 1.2rem rgba(255,255,255,.12);
}
.scene.slower{--void-cycle:.2s}
.scene.heavy .void-light{opacity:.88;filter:blur(1.45rem);text-shadow:0 0 18px rgba(255,255,255,1),0 0 42px rgba(223,243,255,.95),0 0 82px rgba(180,214,255,.72)}
.scene.heavy .void-halo{opacity:.44;filter:blur(4rem)}
.scene.heavy .void-core{opacity:.22}
.scene.black .void-light{opacity:.46;filter:blur(.64rem);text-shadow:0 0 10px rgba(255,255,255,.74),0 0 24px rgba(223,243,255,.56)}
.scene.black .void-halo{opacity:.16;filter:blur(1.7rem)}
.scene.black .void-core{opacity:.04}
@keyframes voidBlackFace{
  0%,100%{opacity:1;color:#000}
  50%{opacity:.02;color:#000}
}
@keyframes voidLetterLight{
  0%,100%{opacity:.72}
  50%{opacity:0}
}
@keyframes voidHalo{
  0%,100%{opacity:.28}
  50%{opacity:0}
}
@keyframes voidCoreStrobe{
  0%,100%{opacity:.14}
  50%{opacity:.006}
}
@media (prefers-reduced-motion:reduce){
  .void-face,.void-light,.void-halo,.void-core{animation:none!important}
  .void-face{opacity:1;color:#000}
  .void-light{opacity:.38}
  .void-halo{opacity:.16}
  .void-core{opacity:.06}
}
</style>
</head>
<body>
<main id="scene" class="scene strobe" aria-label="Void background 0.1 second black text strobe test">
  <div class="badge">PROOF v232C VOID BLACK TEXT 0.1s</div>
  <div class="status" id="status">0.1s black</div>
  <section class="void-stack" aria-hidden="true">
    <div class="void-core"></div>
    <div class="void-halo">THE VOID</div>
    <div class="void-light">THE VOID</div>
    <div class="void-face">THE VOID</div>
  </section>
  <nav class="controls" aria-label="Void background controls">
    <button data-mode="strobe" class="active">0.1s black</button>
    <button data-mode="slower">0.2s</button>
    <button data-mode="heavy">heavy</button>
    <button data-mode="black">black</button>
  </nav>
</main>
<script>
const scene=document.getElementById('scene');
const status=document.getElementById('status');
document.querySelectorAll('[data-mode]').forEach(button=>{
  button.addEventListener('pointerup',event=>{
    event.preventDefault();
    const mode=button.dataset.mode;
    scene.className='scene '+mode;
    status.textContent=button.textContent.trim();
    document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===button));
  },{passive:false});
});
</script>
</body>
</html>
