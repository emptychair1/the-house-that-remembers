<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>CodePen VOID Strobe Proof v234</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
body{
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Arial',sans-serif;
}
.badge,.status{
  position:fixed;
  z-index:10;
  color:rgba(255,255,255,.52);
  background:#000;
  border:1px solid rgba(255,255,255,.18);
  padding:4px 6px;
  font:700 8px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  pointer-events:none;
}
.badge{left:10px;top:calc(env(safe-area-inset-top) + 10px)}
.status{right:10px;top:calc(env(safe-area-inset-top) + 10px);border-radius:999px}
.strobe-container{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:#000;
}
.strobe-text{
  margin:0;
  max-width:96vw;
  color:#fff;
  font-family:'Arial',sans-serif;
  font-size:min(26vw,34vh);
  font-weight:700;
  line-height:.82;
  letter-spacing:-.04em;
  text-align:center;
  white-space:nowrap;
  text-transform:uppercase;
  animation:strobe-light .1s infinite;
}
@keyframes strobe-light{
  0%,100%{
    color:#fff;
    text-shadow:0 0 10px #fff,0 0 20px #00d4ff,0 0 30px #ff005e,0 0 40px #ff8c00;
  }
  50%{
    color:transparent;
    text-shadow:0 0 5px #000,0 0 10px #000;
  }
}
</style>
</head>
<body>
<div class="badge">PROOF v234 CODEPEN VOID</div>
<div class="status">Arial · 0.1s · CodePen colors</div>
<div class="strobe-container">
  <h1 class="strobe-text">VOID</h1>
</div>
</body>
</html>
