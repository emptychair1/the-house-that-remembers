<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Void Background Harness v232B</title>
<style>
:root{
  --void-cycle: .1s;
  --void-font: clamp(10.5rem,46.5vw,42rem);
  --void-width: 240vw;
  --void-height: 78vh;
  --void-letter-spacing: -.09em;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
.scene{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
  display:grid;
  place-items:center;
  isolation:isolate;
}
.badge{
  position:fixed;
  left:10px;
  top:calc(env(safe-area-inset-top) + 10px);
  z-index:30;
  color:rgba(255,255,255,.52);
  background:rgba(0,0,0,.68);
  border:1px solid rgba(255,255,255,.18);
  padding:4px 6px;
  font:700 8px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  pointer-events:none;
}
.status{
  position:fixed;
  right:10px;
  top:calc(env(safe-area-inset-top) + 10px);
  z-index:30;
  color:rgba(255,255,255,.44);
  background:rgba(0,0,0,.52);
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  padding:4px 7px;
  font:700 8px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.1em;
  text-transform:uppercase;
  pointer-events:none;
}
.void-stack{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--void-width);
  height:var(--void-height);
  transform:translate(-50%,-50%);
  display:grid;
  place-items:center;
}
.void-text,
.void-shadow{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font:900 var(--void-font)/.78 Impact,'Arial Black',Anton,sans-serif;
  letter-spacing:var(--void-letter-spacing);
  text-transform:uppercase;
  white-space:nowrap;
  transform:translateZ(0);
}
.void-shadow{
  color:rgba(255,255,255,.16);
  filter:blur(1.15rem);
  opacity:.32;
  transform:translateZ(0) scale(1.018);
  animation:voidShadowPulse .1s infinite steps(1,end);
}
.void-text{
  color:#fff;
  animation:voidStrobe .1s infinite steps(1,end);
}
.void-core{
  position:absolute;
  inset:-22vh -32vw;
  background:radial-gradient(ellipse at center,rgba(235,246,255,.28) 0%,rgba(196,220,240,.08) 22%,rgba(0,0,0,0) 54%);
  opacity:.18;
  animation:voidCoreStrobe .1s infinite steps(1,end);
}
.controls{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 1rem);
  transform:translateX(-50%);
  z-index:25;
  display:flex;
  gap:.45rem;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  width:min(92vw,38rem);
}
button{
  appearance:none;
  border:1px solid rgba(255,255,255,.24);
  border-radius:999px;
  background:rgba(0,0,0,.68);
  color:rgba(255,255,255,.86);
  padding:.58rem .75rem;
  font:700 .62rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  -webkit-tap-highlight-color:transparent;
}
button.active{
  background:rgba(255,255,255,.14);
  border-color:rgba(255,255,255,.48);
  color:#fff;
  box-shadow:0 0 1.2rem rgba(255,255,255,.12);
}
.scene.slower{--void-cycle:.2s}.scene.slower .void-text{animation-duration:.2s}.scene.slower .void-shadow{animation-duration:.2s}.scene.slower .void-core{animation-duration:.2s}
.scene.heavy{--void-cycle:.1s}.scene.heavy .void-text{filter:contrast(1.25)}.scene.heavy .void-shadow{opacity:.46;filter:blur(1.8rem)}.scene.heavy .void-core{opacity:.26}
.scene.black{--void-cycle:.1s}.scene.black .void-text{animation-name:voidBlackStrobe}.scene.black .void-shadow{opacity:.18;filter:blur(.7rem)}.scene.black .void-core{opacity:.06}
@keyframes voidStrobe{
  0%,100%{
    color:#fff;
    text-shadow:0 0 10px #fff,0 0 20px #dff3ff,0 0 30px #b4d6ff,0 0 40px #ffffff;
  }
  50%{
    color:transparent;
    text-shadow:0 0 5px #000,0 0 10px #000;
  }
}
@keyframes voidBlackStrobe{
  0%,100%{
    color:rgba(255,255,255,.86);
    text-shadow:0 0 6px #fff,0 0 18px #e9f5ff,0 0 28px #c4dfff;
  }
  50%{
    color:#000;
    text-shadow:0 0 5px #000,0 0 12px #000;
  }
}
@keyframes voidShadowPulse{
  0%,100%{opacity:.42}
  50%{opacity:.04}
}
@keyframes voidCoreStrobe{
  0%,100%{opacity:.18}
  50%{opacity:.015}
}
@media (prefers-reduced-motion:reduce){
  .void-text,.void-shadow,.void-core{animation:none!important}
  .void-text{color:#fff;text-shadow:0 0 10px #fff,0 0 20px #dff3ff,0 0 30px #b4d6ff}
  .void-shadow{opacity:.24}
  .void-core{opacity:.10}
}
</style>
</head>
<body>
<main id="scene" class="scene strobe" aria-label="Void background 0.1 second strobe test">
  <div class="badge">PROOF v232B VOID 0.1s STROBE</div>
  <div class="status" id="status">0.1s</div>
  <section class="void-stack" aria-hidden="true">
    <div class="void-core"></div>
    <div class="void-shadow">THE VOID</div>
    <div class="void-text">THE VOID</div>
  </section>
  <nav class="controls" aria-label="Void background controls">
    <button data-mode="strobe" class="active">0.1s</button>
    <button data-mode="slower">0.2s</button>
    <button data-mode="heavy">heavy</button>
    <button data-mode="black">black</button>
  </nav>
</main>
<script>
const scene=document.getElementById('scene');
const status=document.getElementById('status');
document.querySelectorAll('[data-mode]').forEach(button=>{
  button.addEventListener('pointerup',event=>{
    event.preventDefault();
    const mode=button.dataset.mode;
    scene.className='scene '+mode;
    status.textContent=button.textContent.trim();
    document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===button));
  },{passive:false});
});
</script>
</body>
</html>
