<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Rubik Letter Cell Stack Split v233C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
:root{
  --split-duration:6.5s;
  --strobe-cycle:1s;
  --block-width:min(88vw,34rem);
  --word-size:clamp(3.35rem,16vw,9.5rem);
  --the-start:-4.8rem;
  --void-start:2.55rem;
  --the-end:-18vh;
  --void-end:16vh;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
.scene{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
  display:grid;
  place-items:center;
  isolation:isolate;
}
.badge,.status{
  position:fixed;
  z-index:30;
  color:rgba(255,255,255,.52);
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.18);
  padding:4px 6px;
  font:700 8px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
  pointer-events:none;
}
.badge{left:10px;top:calc(env(safe-area-inset-top) + 10px)}
.status{right:10px;top:calc(env(safe-area-inset-top) + 10px);border-radius:999px}
.title-stage{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
}
.word{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--block-width);
  height:1em;
  transform:translate(-50%,-50%);
  font-family:'Rubik Mono One',ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:var(--word-size);
  font-weight:400;
  text-transform:uppercase;
  white-space:nowrap;
  line-height:.82;
  transform-origin:center center;
  will-change:transform;
}
.word.the{animation:splitThe var(--split-duration) cubic-bezier(.18,.78,.16,1) forwards}
.word.void{animation:splitVoid var(--split-duration) cubic-bezier(.18,.78,.16,1) forwards}
.layer{
  position:absolute;
  inset:0;
  display:grid;
  width:100%;
  height:1em;
  align-items:center;
  justify-items:center;
}
.the .layer{grid-template-columns:repeat(3,1fr)}
.void .layer{grid-template-columns:repeat(4,1fr)}
.cell{
  display:grid;
  place-items:center;
  width:100%;
  height:1em;
  text-align:center;
}
.face{
  z-index:3;
  color:#000;
  opacity:1;
  text-shadow:none;
  animation:titleFace var(--strobe-cycle) infinite steps(1,end);
}
.light{
  z-index:2;
  color:#fff;
  filter:blur(.18em);
  opacity:.50;
  transform:scale(1.018);
  text-shadow:
    0 0 .10em #fff,
    0 0 .24em #fff,
    0 0 .50em #fff;
  animation:titleLight var(--strobe-cycle) infinite steps(1,end);
}
.halo{
  z-index:1;
  color:#fff;
  filter:blur(.46em);
  opacity:.16;
  transform:scale(1.05);
  animation:titleHalo var(--strobe-cycle) infinite steps(1,end);
}
.guide-gap{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--block-width);
  height:clamp(2.4rem,10vh,6.4rem);
  transform:translate(-50%,-50%);
  border-top:1px solid rgba(255,255,255,.07);
  border-bottom:1px solid rgba(255,255,255,.07);
  opacity:0;
  animation:gapGhost var(--split-duration) cubic-bezier(.18,.78,.16,1) forwards;
}
@keyframes splitThe{
  0%{transform:translate(-50%,calc(-50% + var(--the-start)))}
  100%{transform:translate(-50%,calc(-50% + var(--the-end)))}
}
@keyframes splitVoid{
  0%{transform:translate(-50%,calc(-50% + var(--void-start)))}
  100%{transform:translate(-50%,calc(-50% + var(--void-end)))}
}
@keyframes titleFace{
  0%,100%{opacity:1;color:#000}
  50%{opacity:.08;color:#000}
}
@keyframes titleLight{
  0%,100%{opacity:.50}
  50%{opacity:0}
}
@keyframes titleHalo{
  0%,100%{opacity:.16}
  50%{opacity:0}
}
@keyframes gapGhost{
  0%,32%{opacity:0}
  100%{opacity:.28}
}
@media (prefers-reduced-motion:reduce){
  .word.the{animation:none;transform:translate(-50%,calc(-50% + var(--the-end)))}
  .word.void{animation:none;transform:translate(-50%,calc(-50% + var(--void-end)))}
  .face,.light,.halo,.guide-gap{animation:none!important}
  .face{opacity:1;color:#000}
  .light{opacity:.36}
  .halo{opacity:.12}
  .guide-gap{opacity:.22}
}
</style>
</head>
<body>
<main class="scene" aria-label="Rubik Mono One fixed letter-cell title split proof">
  <div class="badge">PROOF v233C FIXED LETTER CELLS</div>
  <div class="status">6.5s split · 1s pure-white strobe</div>
  <section class="title-stage" aria-hidden="true">
    <div class="guide-gap"></div>
    <div class="word the">
      <span class="layer halo"><span class="cell">T</span><span class="cell">H</span><span class="cell">E</span></span>
      <span class="layer light"><span class="cell">T</span><span class="cell">H</span><span class="cell">E</span></span>
      <span class="layer face"><span class="cell">T</span><span class="cell">H</span><span class="cell">E</span></span>
    </div>
    <div class="word void">
      <span class="layer halo"><span class="cell">V</span><span class="cell">O</span><span class="cell">I</span><span class="cell">D</span></span>
      <span class="layer light"><span class="cell">V</span><span class="cell">O</span><span class="cell">I</span><span class="cell">D</span></span>
      <span class="layer face"><span class="cell">V</span><span class="cell">O</span><span class="cell">I</span><span class="cell">D</span></span>
    </div>
  </section>
</main>
</body>
</html>
