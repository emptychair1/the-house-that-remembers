<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>House Reset</title><style>html,body{margin:0;background:#000;color:#f3eee3;font:16px system-ui;height:100%}body{display:grid;place-items:center;text-align:center;padding:24px}.dim{opacity:.65}</style></head><body><main><p id="s">Restoring the House…</p><p class="dim">Clearing the old reader shell.</p></main><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}document.getElementById('s').textContent='House restored. Opening the book…';setTimeout(()=>location.replace('./proof-v244-fresh-bbfc8aa.html?house='+Date.now()),700)})();</script></body></html>
