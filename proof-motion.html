<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Motion Rosetta Stone</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;background:#000}
.turn-page{position:fixed;inset:0;z-index:5;border:0;padding:0;margin:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;color:transparent}
.turn-page:focus{outline:none}
.turn-page-label{position:fixed;z-index:6;left:50%;bottom:max(1.05rem,env(safe-area-inset-bottom));transform:translateX(-50%);font:700 .54rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,234,215,.46);pointer-events:none;text-shadow:0 0 .75rem #000;white-space:nowrap}
.build{position:fixed;z-index:6;left:.55rem;bottom:max(.45rem,env(safe-area-inset-bottom));font:700 .48rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:rgba(244,234,215,.46);pointer-events:none}
</style>
</head>
<body>
<canvas id="c" aria-label="The House That Remembers motion proof"></canvas>
<button id="turnPage" class="turn-page" type="button" aria-label="Turn page to the restored reader">Turn page</button>
<div class="turn-page-label">tap to turn page</div>
<div class="build">ROSETTA STREAM v6</div>
<script src="./proof-motion.js?v=rosetta-stream-v6"></script>
<script>
(() => {
  const target = './proof-v231.html?v=rollback-restored-5795482-from-cover';
  const turn = () => { window.location.href = target; };
  const btn = document.getElementById('turnPage');
  btn.addEventListener('click', turn, { passive: true });
  btn.addEventListener('touchend', turn, { passive: true });
})();
</script>
</body>
</html>
