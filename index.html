<style>
#v231-root-assert{position:fixed;left:12px;bottom:86px;z-index:2147483647;color:#fff;background:rgba(0,0,0,.82);border:1px solid rgba(255,255,255,.35);padding:6px 8px;font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<main id="reader" aria-label="The House That Remembers"></main>
<div id="v231-root-assert">ROOT v231A START</div>
<script type="module">
const BUILD='book-foreword-v231a-text-backlight-assert-phone';
const assertEl=document.getElementById('v231-root-assert');
const setAssert=text=>{ if(assertEl) assertEl.textContent=text; };
window.__HOUSE_ROOT_ASSERT=BUILD;
try{
  document.documentElement.style.overflow='hidden';
  document.body.style.overflow='hidden';
  if('caches' in window){
    const keys=await caches.keys();
    await Promise.all(keys.map(key=>caches.delete(key)));
  }
  if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(reg=>reg.unregister()));
    navigator.serviceWorker.register=()=>Promise.resolve({disabled:true,build:BUILD});
  }
}catch(err){console.warn('cache reset skipped',err)}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=()=>resolve(src);s.onerror=()=>reject(new Error('failed '+src));document.body.appendChild(s)})}
await loadScript('https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js').catch(err=>console.warn('StPageFlip unavailable, static fallback will run',err));
await loadScript('./book-clean-surface-v1.js?v='+BUILD);
await loadScript('./book-foreword-v226-black-clean-audio.js?v='+BUILD);
try{
  await loadScript('./book-foreword-v231-text-backlight.js?v='+BUILD+'&assert=1');
  window.__VOID_V231_ASSERT='loaded';
  setAssert('ROOT v231A: V231 SCRIPT LOADED');
}catch(err){
  window.__VOID_V231_ASSERT='failed';
  setAssert('ROOT v231A: V231 SCRIPT FAILED');
  console.error(err);
}
</script>
</body>
