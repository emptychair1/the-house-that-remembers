<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>The House That Remembers</title><style>html,body{margin:0;background:#000;color:#f3eee3;height:100%;font-family:Georgia,serif}body{display:grid;place-items:center}.house{opacity:.72;letter-spacing:.08em}</style></head><body><div class="house">THE HOUSE THAT REMEMBERS</div><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}location.replace('./proof-v244-fresh-bbfc8aa.html?house='+Date.now());})();</script></body></html>
