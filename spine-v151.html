<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The House That Remembers — Spine v1.51</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#000;overflow:hidden}iframe{display:block}</style></head><body><iframe id="book" src="./spine-v150.html?base=150" title="The House That Remembers"></iframe><script>
const LABEL='SPINE v1.51 · SINGLE-FIRE FALL';
function leaf(win){let cur=win;for(let i=0;i<24;i++){const d=cur.document,n=d.querySelector('#book');if(!n||!n.contentWindow)return {w:cur,d};cur=n.contentWindow;}return {w:cur,d:cur.document}}
