<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Refresh The House</title>
<style>
  html,body{margin:0;min-height:100%;background:#000;color:#eee;font:16px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;display:grid;place-items:center;text-align:center}
  main{width:min(32rem,84vw)}
  a{color:#fff}
  small{display:block;color:#aaa;margin-top:1rem}
</style>
</head>
<body>
<main>
  <p>Clearing the old shell.</p>
  <p>Sending you back to the current book.</p>
  <small>If this page does not move, tap <a href="./?v=book-foreword-v226-black-clean-audio-phone&refresh=manual">continue</a>.</small>
</main>
<script type="module">
const NEXT = './?v=book-foreword-v226-black-clean-audio-phone&refresh=' + Date.now();
try {
  if ('caches' in window) {
    const keys = await caches.keys();
    await Promise.all(keys.map(key => caches.delete(key)));
  }
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(reg => reg.unregister()));
  }
} catch (error) {
  console.warn('refresh cleanup skipped', error);
}
location.replace(NEXT);
</script>
</body>
</html>
