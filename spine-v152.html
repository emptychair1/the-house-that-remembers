<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The House That Remembers — Spine v1.52</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#000;overflow:hidden}iframe{display:block}</style></head><body><iframe id="book" src="./spine-v150.html?base=150" title="The House That Remembers"></iframe><script>
const LABEL='SPINE v1.52 · LESS SINGLE OWNER';
function leaf(win){let cur=win;for(let i=0;i<24;i++){const d=cur.document,n=d.querySelector('#book');if(!n||!n.contentWindow)return {w:cur,d};cur=n.contentWindow;}return {w:cur,d:cur.document}}
const root=document.querySelector('#book');root.addEventListener('load',()=>setTimeout(()=>{const L=leaf(root.contentWindow);if(!L)return;const {w,d}=L;const fall=d.querySelector('.p3-fall');if(fall)fall.dataset.p3done='1';const stamp=()=>{const b=d.querySelector('.version-badge');if(b)b.textContent=LABEL};stamp();let n=0,t=w.setInterval(()=>{stamp();if(++n>20)w.clearInterval(t)},250)},300));
</script></body></html>
