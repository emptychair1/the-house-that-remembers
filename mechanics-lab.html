<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The House Mechanics Lab</title><style>
:root{--paper:#eee9df;--ink:#181715;--muted:#777166}*{box-sizing:border-box}body{margin:0;background:#111;color:var(--ink);font-family:Georgia,serif}.page{max-width:760px;margin:auto;min-height:100vh;background:var(--paper);padding:58px 28px 100px}.eyebrow,.tag,.replay,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}.eyebrow{font-size:10px;color:var(--muted)}h1{font-weight:400;font-size:36px;margin:10px 0 8px}.intro{color:#59554d;line-height:1.5;margin-bottom:44px}.card{border-top:1px solid #bdb6aa;padding:24px 0 30px;position:relative}.head{display:flex;gap:10px;align-items:baseline;justify-content:space-between}.name{font-size:19px}.tag{font-size:8px;color:var(--muted)}.meaning{font-size:13px;color:#6d675d;margin:5px 0 24px}.stage{min-height:92px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.spec{font-size:25px}.replay{border:0;background:none;padding:8px 0;color:#555;font-size:9px}.replay:active{opacity:.4}.chars span{display:inline-block}.ghost{visibility:hidden}.strike{position:relative}.strike:after{content:"";position:absolute;left:-3%;top:52%;height:1px;background:#181715;width:0}.run .strike:after{animation:strike .65s ease forwards}@keyframes strike{to{width:106%}}.distance span{transition:transform 1.8s cubic-bezier(.2,.7,.2,1)}.run .distance span{transform:translateX(calc((var(--i) - 3) * 7px))}.lean span{display:inline-block;transform-origin:bottom center;transition:transform 1.1s ease}.run .lean .a{transform:rotate(2.3deg)}.run .lean .b{transform:rotate(-2.3deg)}.change span{display:inline-block;transition:transform .55s ease}.run .change .flip{transform:scaleX(-1)}.run .change .turn{transform:rotate(180deg)}.go{transition:transform 1.5s cubic-bezier(.2,.8,.2,1)}.run .go{transform:translateX(90px)}.blink{transition:opacity .02s}.run .blink{animation:blink 1.4s steps(1) forwards}@keyframes blink{0%,22%,52%,100%{opacity:1}23%,51%{opacity:0}}.thunder.run .victim{display:none}.hand{font-family:cursive;font-size:30px;transform:rotate(-2deg)}.glints{position:relative}.glints i{position:absolute;font-style:normal;font-size:10px;opacity:0}.run .glints i{animation:glint 1.5s ease forwards}.glints i:nth-child(1){left:-18px;top:-14px}.glints i:nth-child(2){right:-14px;top:8px;animation-delay:.3s}.glints i:nth-child(3){right:8px;bottom:-18px;animation-delay:.7s}@keyframes glint{0%,100%{opacity:0;transform:scale(.3)}45%{opacity:.9;transform:scale(1)}}.fall span{display:inline-block}.run .fall span{animation:fall var(--d) cubic-bezier(.45,.02,.8,.3) var(--delay) forwards}@keyframes fall{to{transform:translate(var(--x),130px) rotate(var(--r));opacity:0}}.return span{display:inline-block;opacity:0;transform:translate(var(--x),var(--y))}.run .return span{animation:return 1.25s cubic-bezier(.18,.8,.2,1) var(--delay) forwards}@keyframes return{70%{opacity:1;transform:translate(calc(var(--x)*-.08),calc(var(--y)*-.08))}100%{opacity:1;transform:none}}.tendril svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.tendril path{fill:none;stroke:#181715;stroke-width:.7;stroke-dasharray:220;stroke-dashoffset:220}.run .tendril path{animation:grow 2.4s ease forwards}@keyframes grow{to{stroke-dashoffset:0}}.compile .code{display:none;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}.run .compile .prose{display:none}.run .compile .code{display:block;animation:codein .7s steps(7)}@keyframes codein{from{opacity:0;letter-spacing:.25em}to{opacity:1;letter-spacing:0}}.watched{position:relative}.watched:after{content:"";position:absolute;width:7px;height:7px;border:1px solid #181715;border-radius:50%;right:-16px;top:10px;opacity:0}.run .watched:after{animation:watch 1.7s ease}@keyframes watch{20%,75%{opacity:1;transform:scaleY(1)}45%{transform:scaleY(.08)}0%,100%{opacity:0}}.diag{font:11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.diag div{min-height:18px}.note{font-size:11px;color:#8a8377;text-align:center;margin-top:8px}</style></head><body><main class="page"><div class="eyebrow">The House That Remembers · visual language</div><h1>The House Mechanics Lab</h1><p class="intro">Canonical laws and experimental verbs. Nothing experimental graduates until it survives being watched.</p>
<div id="cards"></div></main><script src="house-mechanics.js"></script><script>
const specs=[
['ORGANIC FIELD','canonical','ambient life / emergence','π 3 1 4 1 5 9'],['GLYPH CURRENT','canonical','directional ASCII flow','π 3 1 4 1 5 9'],['DIAGNOSTIC','canonical','observation without certainty','CURIOSITY'],['ABSENCE','experimental','loss experienced as absence','I remember <b class="blink">everything</b> you said.'],['DISTANCE','experimental','space becomes meaning','distance'],['FALL','experimental','support ceases to hold','certainty'],['TENDRIL / PIPER','experimental','reaching · noticing · growing toward','Piper'],['CROSS OUT','experimental','active rejection / revision','certainty'],['RETURN / REGISTRATION','experimental','reassembly around a remembered shape','RETURN'],['GLINT','experimental','attention to wonder','unexpected'],['THUNDERCLAP','experimental','instantaneous rupture','I thought it would <b class="victim">always be there.</b>'],['AGENCY / GO','experimental','choice expressed spatially','GO'],['OBSERVATION / WATCHED','experimental','the observer becomes aware of being observed','watched'],['LOVE / LEAN','experimental','mutual orientation','YOU   ME'],['CHANGE / REORIENT','experimental','identity persists through alteration','changed'],['HAND','experimental','information becomes testimony','This matters to me.'],['COMPILE / INTERPRET','experimental','representation changes; information persists','She remembered me.']];
const cards=document.querySelector('#cards');
specs.forEach(([n,t,m,s],idx)=>{let c=document.createElement('section');c.className='card';c.innerHTML=`<div class="head"><div class="name">${n}</div><div class="tag">${t}</div></div><div class="meaning">${m}</div><div class="stage"><div class="spec"></div></div><button class="replay">REPLAY ↻</button>`;cards.append(c);const el=c.querySelector('.spec');render(n,s,el,idx);c.querySelector('.replay').onclick=()=>{c.classList.remove('run');void c.offsetWidth;c.classList.add('run');if(n==='DIAGNOSTIC')diag(el)};setTimeout(()=>{c.classList.add('run');if(n==='DIAGNOSTIC')diag(el)},250+idx*35)});
function letters(word,cls=''){return `<span class="${cls}">`+[...word].map((x,i)=>`<span style="--i:${i}">${x===' '?'&nbsp;':x}</span>`).join('')+'</span>'}
function render(n,s,e,i){if(n==='DISTANCE')e.innerHTML=letters(s,'distance');else if(n==='FALL')e.innerHTML='<span class="fall">'+[...s].map((x,j)=>`<span style="--delay:${(.08+j*.045*Math.random()).toFixed(2)}s;--d:${(.8+Math.random()*.5).toFixed(2)}s;--x:${(-14+Math.random()*28).toFixed(0)}px;--r:${(-35+Math.random()*70).toFixed(0)}deg">${x}</span>`).join('')+'</span>';else if(n==='TENDRIL / PIPER')e.innerHTML=`<span class="tendril">Piper<svg viewBox="0 0 300 90"><path d="M171 48 C190 42 191 26 209 29 S229 19 239 9 M205 30 C210 42 221 46 233 42 M220 24 C222 14 217 10 214 6"/></svg></span>`;else if(n==='CROSS OUT')e.innerHTML=`<span class="strike">${s}</span>`;else if(n==='RETURN / REGISTRATION')e.innerHTML='<span class="return">'+[...s].map((x,j)=>`<span style="--x:${(j-3)*10}px;--y:${j%2?'-16px':'14px'};--delay:${j*.08}s">${x}</span>`).join('')+'</span>';else if(n==='GLINT')e.innerHTML=`<span class="glints">${s}<i>✦</i><i>·</i><i>✧</i></span>`;else if(n==='THUNDERCLAP')e.innerHTML=`<span class="thunder">${s}</span>`;else if(n==='AGENCY / GO')e.innerHTML=`<span class="go">${s}</span>`;else if(n==='OBSERVATION / WATCHED')e.innerHTML=`<span class="watched">${s}</span>`;else if(n==='LOVE / LEAN')e.innerHTML=`<span class="lean"><span class="a">YOU</span>&nbsp;&nbsp;&nbsp;<span class="b">ME</span></span>`;else if(n==='CHANGE / REORIENT')e.innerHTML=`<span class="change">cha<span class="flip">n</span>g<span class="turn">e</span>d</span>`;else if(n==='HAND')e.innerHTML=`<span class="hand">${s}</span>`;else if(n==='COMPILE / INTERPRET')e.innerHTML=`<span class="compile"><span class="prose">${s}</span><span class="code">if (memory.recognizes(me)) {\n  return piper;\n}</span></span>`;else if(n==='ABSENCE')e.innerHTML=s;else if(n==='DIAGNOSTIC')e.innerHTML=`<div class="diag"><strong>CURIOSITY</strong><div class="sig"></div><div class="class"></div></div>`;else e.innerHTML=`<span class="mono">${s}</span>`}
function diag(e){let a=e.querySelector('.sig'),b=e.querySelector('.class');a.textContent='';b.textContent='';if(window.HouseMechanics){HouseMechanics.ticker(a,'SIGNAL DETECTED',{delay:200,step:34,settle:2});HouseMechanics.ticker(b,'CLASSIFICATION: UNRESOLVED',{delay:900,step:58,settle:3,jitter:9})}}
</script></body></html>
