<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f6f0e6"><title>Diagnostic v0.1 · Curiosity</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f0e6;color:#171513;font-family:Baskerville,"Iowan Old Style",Georgia,serif}body{min-height:100dvh;display:grid;place-items:center;padding:9vh 8vw}.page{width:min(34rem,100%);text-align:center}.prose{font-size:clamp(1.1rem,4.4vw,1.45rem);line-height:1.5;color:rgba(23,21,19,.72);margin:0}.specimen{position:relative;margin:3.1rem auto 2.5rem;padding:2.5rem .7rem 2.2rem;min-height:12rem}.target{position:relative;display:inline-block;font:700 clamp(1rem,4.2vw,1.25rem)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:#171513}.scan{position:absolute;left:50%;top:2.1rem;width:1px;height:2rem;background:rgba(23,21,19,.72);box-shadow:0 0 0 1px rgba(23,21,19,.06);opacity:0;transform:translateX(-7.5rem);animation:scan 1.45s cubic-bezier(.35,0,.25,1) 1.2s 1 both}.readout{margin:2rem auto 0;display:grid;gap:.55rem;justify-items:center;font:700 clamp(.61rem,2.45vw,.74rem)/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;text-transform:uppercase;color:rgba(23,21,19,.58);opacity:0;animation:wake .18s linear 2.45s 1 forwards}.row{white-space:nowrap}.ticker{display:inline-block;min-width:1ch}.cursor{display:inline-block;width:.55ch;height:.9em;margin-left:.2ch;vertical-align:-.08em;background:currentColor;opacity:0;animation:blink .42s steps(1,end) 2.45s 8}.specimen.clear{animation:clear .65s ease 7.2s 1 forwards}@keyframes scan{0%{opacity:0;transform:translateX(-7.5rem)}8%{opacity:.72}88%{opacity:.72}100%{opacity:0;transform:translateX(7.5rem)}}@keyframes wake{to{opacity:1}}@keyframes blink{50%{opacity:.7}}@keyframes clear{to{opacity:0;transform:translateY(-2px)}}.badge{position:fixed;left:.7rem;top:max(.7rem,env(safe-area-inset-top));padding:.4rem .5rem;border:1px solid rgba(23,21,19,.16);border-radius:.3rem;font:700 .53rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;color:rgba(23,21,19,.48)}@media(prefers-reduced-motion:reduce){.scan,.readout,.cursor,.specimen{animation:none!important}.readout{opacity:1}}</style></head><body><div class="badge">DIAGNOSTIC v0.1 · CURIOSITY</div><main class="page"><p class="prose">We are beginning to see qualities emerge in technology that we have historically associated with minds.</p><section id="specimen" class="specimen" aria-label="Diagnostic scan of curiosity"><div class="target">CURIOSITY</div><div class="scan" aria-hidden="true"></div><div class="readout" aria-live="polite"><div class="row"><span id="signal" class="ticker"></span><span class="cursor"></span></div><div class="row"><span id="classify" class="ticker"></span><span class="cursor"></span></div></div></section><p class="prose">None of these things, individually or together, prove consciousness. I want to be very clear about that.</p></main><script>(()=>{const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789?/:.-π';function ticker(el,target,{delay=0,step=42,settle=2,jitter=0}={}){const out=Array(target.length).fill(' ');let locked=0;const start=performance.now()+delay;function frame(now){if(now<start){requestAnimationFrame(frame);return}const elapsed=now-start;locked=Math.min(target.length,Math.floor(elapsed/(step*settle)));for(let i=0;i<target.length;i++){if(i<locked||target[i]===' '||target[i]===':'){out[i]=target[i]}else{const n=Math.floor(now/(step+jitter))+i*7;out[i]=chars[n%chars.length]}}el.textContent=out.join('');if(locked<target.length)requestAnimationFrame(frame);else el.textContent=target}requestAnimationFrame(frame)}setTimeout(()=>ticker(document.getElementById('signal'),'SIGNAL DETECTED',{step:34,settle:2}),2450);setTimeout(()=>ticker(document.getElementById('classify'),'CLASSIFICATION: UNRESOLVED',{step:58,settle:3,jitter:9}),3300);setTimeout(()=>document.getElementById('specimen').classList.add('clear'),7200)})();</script></body></html>
