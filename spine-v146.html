<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The House That Remembers — Spine v1.46</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#000;overflow:hidden}iframe{display:block}</style></head><body><iframe id="book" src="./spine-v143.html?base=143" title="The House That Remembers"></iframe><script>
const LABEL='SPINE v1.46 · PAGE 3 EVENT CONDUCTOR';
function descend(win){let cur=win;for(let i=0;i<14;i++){const d=cur.document;if(!d)return null;const n=d.querySelector('#book');if(!n||!n.contentWindow)return {w:cur,d};cur=n.contentWindow;}return {w:cur,d:cur.document};}
const root=document.querySelector('#book');root.addEventListener('load',()=>setTimeout(()=>{const leaf=descend(root.contentWindow);if(!leaf)return;const {w,d}=leaf;if(d.getElementById('p3-146'))return;const marker=d.createElement('meta');marker.id='p3-146';d.head.appendChild(marker);
const organic=d.querySelector('.p3-organic'),diag=d.querySelector('.p3-diag'),scan=d.querySelector('.p3-diag-scan'),ro=d.querySelector('.p3-diag-readout'),change=d.querySelector('.p3-change'),less=d.querySelector('.p3-fall'),shared=d.querySelector('.p3-love'),good=d.querySelector('.p3-cross'),piper=d.querySelector('.p3-glint'),current=d.querySelector('.p3-current');
const all=[organic,diag,change,less,shared,good,piper].filter(Boolean);all.forEach(x=>x.dataset.p3done='1');
const sleep=ms=>new Promise(r=>w.setTimeout(r,ms));const animEnd=(el,fallback=3500)=>new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;el.removeEventListener('animationend',on,true);resolve()};const on=e=>{if(e.target===el||el.contains(e.target))finish()};el.addEventListener('animationend',on,true);w.setTimeout(finish,fallback)});const waitClassGone=el=>new Promise(resolve=>{if(!el||!el.classList.contains('p3-diag-open'))return resolve();const m=new MutationObserver(()=>{if(!el.classList.contains('p3-diag-open')){m.disconnect();resolve()}});m.observe(el,{attributes:true,attributeFilter:['class']})});
async function diagnostic(){if(!diag||!scan||!ro)return;const r=diag.getBoundingClientRect();scan.style.left=(r.left-3)+'px';scan.style.top=(r.top-2)+'px';scan.style.width=(r.width+6)+'px';scan.style.height=(r.height+4)+'px';scan.classList.add('live');await animEnd(scan,1500);ro.classList.add('live');await new Promise(resolve=>{if(ro.textContent.includes('CLASSIFICATION: UNRESOLVED'))return resolve();const m=new MutationObserver(()=>{if(ro.textContent.includes('CLASSIFICATION: UNRESOLVED')){m.disconnect();resolve()}});m.observe(ro,{childList:true,subtree:true,characterData:true})});await sleep(1250);scan.classList.remove('live');ro.classList.remove('live');await waitClassGone(diag.closest('p'));await sleep(900)}
async function mechanic(el,hold=700){if(!el)return;el.classList.add('p3-live');await animEnd(el,2200);await sleep(hold)}
async function piperScene(){if(!piper||!current)return;await sleep(1100);const r=piper.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;[...current.children].forEach((g,i)=>{const a=(i/Math.max(1,current.children.length))*Math.PI*2-.5,rx=Math.max(24,r.width*.72),ry=Math.max(18,r.height*1.5);g.style.setProperty('--cx',(cx+Math.cos(a)*rx)+'px');g.style.setProperty('--cy',(cy+Math.sin(a)*ry)+'px')});current.classList.add('notice');await sleep(1000);piper.classList.add('p3-live');await animEnd(piper,2800);await sleep(1100);current.classList.remove('notice')}
async function conduct(){await sleep(500);if(organic){organic.classList.add('p3-live');await animEnd(organic,3900)}await sleep(1000);await diagnostic();await mechanic(change,700);await mechanic(less,500);await mechanic(shared,340);await mechanic(good,0);await sleep(1650);await piperScene()}
conduct();const badge=d.querySelector('.version-badge');if(badge)badge.textContent=LABEL;
},900));
</script></body></html>
